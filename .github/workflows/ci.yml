name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      - name: Check Svelte components
        run: npm run check:svelte

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Test production bundle
        run: npm run test:e2e:production

      - name: Upload production bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: production-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-production/
          retention-days: 14

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform providers
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate -no-color

  deploy-production:
    name: Deploy production to AWS
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - check
      - terraform
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Download production bundle
        uses: actions/download-artifact@v8
        with:
          name: production-bundle
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: turntall-production-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload immutable application assets
        run: >-
          aws s3 sync dist/assets "s3://${S3_BUCKET_NAME}/assets"
          --delete
          --cache-control "public,max-age=31536000,immutable"

      - name: Upload production site
        run: >-
          aws s3 sync dist "s3://${S3_BUCKET_NAME}"
          --delete
          --exclude "assets/*"
          --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        # S3 MIME inference for .md differs between platforms. Error responses
        # skip viewer-response functions, so the origin metadata must be right.
        run: |
          aws s3 cp dist "s3://${S3_BUCKET_NAME}" --recursive --exclude "*" --include "*.md" --content-type "text/markdown; charset=utf-8" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
